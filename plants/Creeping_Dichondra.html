               <h2>基本資料</h2> 
               <ul>
                   <li><strong>學名：</strong>Dichondra repens</li>
                   <li><strong>科名：</strong>旋花科(Convolvulaceae)</li>
               </ul>
               <p>全草供藥用，有清熱利尿、祛風止痛、止血生肌、消炎解毒、殺蟲之功。可治急慢性肝炎，黃疸型肝炎，膽囊炎，腎炎，泌尿系感染，扁桃腺炎，口腔炎及癰疔療毒，毒蛇咬傷，乳癰，痢疾，瘧疾，肺出血等。</p>
